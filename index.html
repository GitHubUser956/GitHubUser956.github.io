<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Web Page</title>

  <!-- Simple CSS styling -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    p {
      color: #555;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Hello, world!</h1>
  <p>This is a basic HTML page.</p>

  <button onclick="sayHello()">Click me</button>

  <!-- Simple JavaScript -->
  <script>
    function sayHello() {
      alert("Hello from JavaScript!");
    }
  </script>

</body>
</html>
